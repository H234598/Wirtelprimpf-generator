name: Publish Wirtelprimpf hub Pages
run-name: >-
  Wirtelprimpf hub${{ inputs.generator_ref && format(' · generator {0}', inputs.generator_ref) || '' }}${{ inputs.active_repository && format(' · {0}@{1}', inputs.active_repository, inputs.archive_ref) || '' }}

on:

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      generator_ref:
        description: Full generator commit SHA for an exact build or rollback
        required: false
        type: string
      active_repository:
        description: Canonical active publication repository
        required: false
        type: string
      archive_ref:
        description: Full active archive commit SHA
        required: false
        type: string
      current_volume:
        description: Positive global current story volume
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wirtelprimpf-hub-pages
  # A stale hosted-runner queue must never hide a newer published archive.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate manual revision inputs
        id: revisions
        shell: bash
        env:
          INPUT_GENERATOR_REF: ${{ inputs.generator_ref }}
          INPUT_REPOSITORY: ${{ inputs.active_repository }}
          INPUT_ARCHIVE_REF: ${{ inputs.archive_ref }}
          INPUT_CURRENT_VOLUME: ${{ inputs.current_volume }}
        run: |
          set -euo pipefail
          generator_ref="${INPUT_GENERATOR_REF:-${GITHUB_SHA}}"
          [[ "${generator_ref}" =~ ^[0-9a-fA-F]{40}$ ]]
          if [[ -n "${INPUT_GENERATOR_REF}" ]]; then
            [[ "${INPUT_GENERATOR_REF}" =~ ^[0-9a-fA-F]{40}$ ]]
            test -n "${INPUT_REPOSITORY}"
            test -n "${INPUT_ARCHIVE_REF}"
            test -n "${INPUT_CURRENT_VOLUME}"
          fi
          if [[ -n "${INPUT_REPOSITORY}" || -n "${INPUT_ARCHIVE_REF}" || -n "${INPUT_CURRENT_VOLUME}" ]]; then
            test -n "${INPUT_REPOSITORY}"
            test -n "${INPUT_ARCHIVE_REF}"
            test -n "${INPUT_CURRENT_VOLUME}"
            [[ "${INPUT_ARCHIVE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]
            [[ "${INPUT_CURRENT_VOLUME}" =~ ^[1-9][0-9]*$ ]]
          fi
          echo "generator_ref=${generator_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout generator and public data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.generator_ref || github.sha }}
          sparse-checkout: |
            data
            README.md
            docs/WEB-MEDIA.md
            docs/WEB-MEDIA-SECURITY.md
            config/web-budgets.json
            web
            scripts/build_web_site.py
            scripts/build_web_status.py
            scripts/validate_pages_artifact.py
            scripts/validate_web_budgets.py
            wirtelprimpf_platform
          sparse-checkout-cone-mode: true

      - name: Resolve an exact current-story source
        id: revision
        shell: bash
        env:
          INPUT_REPOSITORY: ${{ inputs.active_repository }}
          INPUT_ARCHIVE_REF: ${{ inputs.archive_ref }}
          INPUT_CURRENT_VOLUME: ${{ inputs.current_volume }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_REPOSITORY}" || -n "${INPUT_ARCHIVE_REF}" || -n "${INPUT_CURRENT_VOLUME}" ]]; then
            test -n "${INPUT_REPOSITORY}" && test -n "${INPUT_ARCHIVE_REF}" && test -n "${INPUT_CURRENT_VOLUME}"
            active_repository="${INPUT_REPOSITORY}"
            archive_ref="${INPUT_ARCHIVE_REF}"
            archive_ref="${archive_ref,,}"
            current_volume="${INPUT_CURRENT_VOLUME}"
          else
            active_repository="$(jq -er '.repository' "${GITHUB_WORKSPACE}/data/hub-source.json")"
            current_volume="$(jq -er '.current_volume | tostring' "${GITHUB_WORKSPACE}/data/hub-source.json")"
            archive_ref="$(git ls-remote "https://github.com/H234598/${active_repository}.git" refs/heads/main | awk 'NF { print $1; exit }')"
            test -n "${archive_ref}"
          fi
          {
            echo "repository=${active_repository}"
            echo "revision=${archive_ref}"
            echo "current_volume=${current_volume}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout exact active publication archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ format('H234598/{0}', steps.revision.outputs.repository) }}
          ref: ${{ steps.revision.outputs.revision }}
          path: current-archive
          lfs: false

      - name: Validate exact current-story source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m wirtelprimpf_platform.hub \
            --data-root "${GITHUB_WORKSPACE}/data" \
            --external-root "${GITHUB_WORKSPACE}/current-archive" \
            --github-output "${GITHUB_OUTPUT}" \
            --repository "${{ steps.revision.outputs.repository }}" \
            --revision "${{ steps.revision.outputs.revision }}" \
            --current-volume "${{ steps.revision.outputs.current_volume }}"

      - name: Checkout verified publication archives
        if: steps.source.outputs.external == 'true'
        env:
          ACTIVE_REPOSITORY: ${{ steps.source.outputs.repository }}
          PUBLISHED_ARCHIVES_ROOT: ${{ runner.temp }}/wirtelprimpf-published-archives
        run: |
          set -euo pipefail
          export PUBLISHED_ARCHIVES_ROOT
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          active = os.environ["ACTIVE_REPOSITORY"]
          root = Path(os.environ["PUBLISHED_ARCHIVES_ROOT"])
          root.mkdir(parents=True, exist_ok=True)
          payload = json.loads((Path(os.environ["GITHUB_WORKSPACE"]) / "data/publication-catalog.json").read_text())
          for entry in payload.get("archives", []):
              if entry.get("verified") is not True:
                  raise SystemExit(f"unverified archive leaked into catalog: {entry.get('repository')}")
              repository = entry.get("repository")
              archive_index = entry.get("archive_index")
              if not isinstance(repository, str) or not isinstance(archive_index, int):
                  raise SystemExit("invalid publication catalog archive identity")
              if repository != f"Wirtelprimpf-{archive_index:04d}" or repository == active:
                  if repository == active:
                      continue
                  raise SystemExit(f"catalog repository naming mismatch: {repository}")
              revision = entry.get("revision")
              if not isinstance(revision, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", revision):
                  result = subprocess.run(
                      ["git", "ls-remote", f"https://github.com/H234598/{repository}.git", "refs/heads/main"],
                      check=True, capture_output=True, text=True,
                  )
                  revision = result.stdout.split()[0] if result.stdout.split() else ""
              if not re.fullmatch(r"[0-9a-fA-F]{40}", revision):
                  raise SystemExit(f"cannot resolve exact catalog revision: {repository}")
              checkout = root / repository
              if checkout.exists() or checkout.is_symlink():
                  raise SystemExit(f"catalog checkout target already exists: {checkout}")
              subprocess.run(["git", "-c", "protocol.version=2", "clone", "--filter=blob:none", "--no-checkout", f"https://github.com/H234598/{repository}.git", str(checkout)], check=True)
              subprocess.run(["git", "-C", str(checkout), "fetch", "--depth", "1", "origin", revision], check=True)
              subprocess.run(["git", "-C", str(checkout), "checkout", "--detach", "FETCH_HEAD"], check=True)
          PY

      - name: Resolve all published story sources
        id: catalog
        if: steps.source.outputs.external == 'true'
        env:
          ACTIVE_REPOSITORY: ${{ steps.source.outputs.repository }}
          CURRENT_VOLUME: ${{ steps.source.outputs.current_volume }}
          PUBLISHED_ARCHIVES_ROOT: ${{ runner.temp }}/wirtelprimpf-published-archives
        run: |
          set -euo pipefail
          export ACTIVE_REPOSITORY CURRENT_VOLUME PUBLISHED_ARCHIVES_ROOT
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          values = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
          def roman_to_integer(value):
              total = 0
              previous = 0
              for character in reversed(value):
                  current = values[character]
                  total += -current if current < previous else current
                  previous = max(previous, current)
              return total

          current_volume = int(os.environ["CURRENT_VOLUME"])
          active_repository = os.environ["ACTIVE_REPOSITORY"]
          roots = [(Path(os.environ["GITHUB_WORKSPACE"]) / "current-archive", active_repository)]
          catalog_root = Path(os.environ["PUBLISHED_ARCHIVES_ROOT"])
          if catalog_root.is_dir():
              roots.extend((path, path.name) for path in sorted(catalog_root.iterdir()) if path.is_dir() and not path.is_symlink())
          found = {}
          for root, repository in roots:
              story_root = root / "Wirtelprimpf"
              if story_root.is_symlink() or not story_root.is_dir():
                  raise SystemExit(f"published story directory is missing or unsafe: {story_root}")
              for path in sorted(story_root.iterdir(), key=lambda item: item.name.casefold()):
                  match = re.fullmatch(r"Wirtelprimpf_Story_([IVXLCDM]+)\.md", path.name)
                  if not match:
                      continue
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit(f"published story file is missing or unsafe: {path}")
                  volume = roman_to_integer(match.group(1))
                  if volume > current_volume:
                      continue
                  expected_repository = f"Wirtelprimpf-{((volume - 1) // 50) + 1:04d}"
                  if repository != expected_repository:
                      raise SystemExit(f"story {volume} is in the wrong archive: {repository}")
                  if volume in found:
                      raise SystemExit(f"duplicate published story volume: {volume}")
                  found[volume] = path.resolve()
          if current_volume not in found:
              raise SystemExit(f"published current story is missing: {current_volume}")
          story_files = json.dumps([str(found[volume]) for volume in sorted(found)], separators=(",", ":"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"story_files={story_files}\n")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install exact dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build and validate hub artifact through staging facade
        env:
          PUBLIC_CATGPT_LIGHT_ENDPOINT: https://catgpt.wirtelprimpf.telacore.org/v1/chat
          WIRTELPRIMPF_DATA_ROOT: ${{ github.workspace }}/data
          WIRTELPRIMPF_SITE_PROFILE: hub
          WIRTELPRIMPF_SITE_URL: https://wirtelprimpf.telacore.org
          WIRTELPRIMPF_CURRENT_STORY: ${{ steps.source.outputs.story_file }}
          WIRTELPRIMPF_STORY_FILES: ${{ steps.catalog.outputs.story_files || steps.source.outputs.story_files }}
          WIRTELPRIMPF_CURRENT_VOLUME: ${{ steps.source.outputs.current_volume }}
          WIRTELPRIMPF_MEDIA_MANIFEST: ${{ steps.source.outputs.media_manifest }}
          WIRTELPRIMPF_MEDIA_REPOSITORY: ${{ steps.source.outputs.repository }}
          WIRTELPRIMPF_README_PATH: ${{ github.workspace }}/README.md
          WIRTELPRIMPF_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/build_web_site.py \
            --profile hub \
            --site-url https://wirtelprimpf.telacore.org \
            --expected-domain wirtelprimpf.telacore.org \
            --data-root "${GITHUB_WORKSPACE}/data" \
            --config config/web-budgets.json \
            --check > "$RUNNER_TEMP/pages-build-report.raw.json"
          jq \
            --arg generator_revision "${{ steps.revisions.outputs.generator_ref }}" \
            --arg archive_revision "${{ steps.source.outputs.revision }}" \
            --arg current_volume "${{ steps.source.outputs.current_volume }}" \
            '. + {generator_revision: $generator_revision, archive_revision: $archive_revision, current_volume: $current_volume}' \
            "$RUNNER_TEMP/pages-build-report.raw.json" > "$RUNNER_TEMP/pages-build-report.json"
          cat "$RUNNER_TEMP/pages-build-report.json"
          grep -R -n "connect-src https://catgpt\.wirtelprimpf\.telacore\.org" web/dist
          grep -E -q '"tree_sha256": "[0-9a-f]{64}"' "$RUNNER_TEMP/pages-build-report.json"

      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact build artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
