name: Publish Wirtelprimpf hub Pages
run-name: >-
  Wirtelprimpf hub${{ inputs.generator_ref && format(' · generator {0}', inputs.generator_ref) || '' }}${{ inputs.active_repository && format(' · {0}@{1}', inputs.active_repository, inputs.archive_ref) || '' }}

on:

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      generator_ref:
        description: Full generator commit SHA for an exact build or rollback
        required: false
        type: string
      active_repository:
        description: Canonical active publication repository
        required: false
        type: string
      archive_ref:
        description: Full active archive commit SHA
        required: false
        type: string
      current_volume:
        description: Positive global current story volume
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wirtelprimpf-hub-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate manual revision inputs
        id: revisions
        shell: bash
        env:
          INPUT_GENERATOR_REF: ${{ inputs.generator_ref }}
          INPUT_REPOSITORY: ${{ inputs.active_repository }}
          INPUT_ARCHIVE_REF: ${{ inputs.archive_ref }}
          INPUT_CURRENT_VOLUME: ${{ inputs.current_volume }}
        run: |
          set -euo pipefail
          generator_ref="${INPUT_GENERATOR_REF:-${GITHUB_SHA}}"
          [[ "${generator_ref}" =~ ^[0-9a-fA-F]{40}$ ]]
          if [[ -n "${INPUT_GENERATOR_REF}" ]]; then
            [[ "${INPUT_GENERATOR_REF}" =~ ^[0-9a-fA-F]{40}$ ]]
            test -n "${INPUT_REPOSITORY}"
            test -n "${INPUT_ARCHIVE_REF}"
            test -n "${INPUT_CURRENT_VOLUME}"
          fi
          if [[ -n "${INPUT_REPOSITORY}" || -n "${INPUT_ARCHIVE_REF}" || -n "${INPUT_CURRENT_VOLUME}" ]]; then
            test -n "${INPUT_REPOSITORY}"
            test -n "${INPUT_ARCHIVE_REF}"
            test -n "${INPUT_CURRENT_VOLUME}"
            [[ "${INPUT_ARCHIVE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]
            [[ "${INPUT_CURRENT_VOLUME}" =~ ^[1-9][0-9]*$ ]]
          fi
          echo "generator_ref=${generator_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout generator and public data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.generator_ref || github.sha }}
          sparse-checkout: |
            data
            README.md
            docs/WEB-MEDIA.md
            docs/WEB-MEDIA-SECURITY.md
            config/web-budgets.json
            web
            scripts/build_web_site.py
            scripts/build_web_status.py
            scripts/validate_pages_artifact.py
            scripts/validate_web_budgets.py
            wirtelprimpf_platform
          sparse-checkout-cone-mode: true

      - name: Resolve an exact current-story source
        id: source
        shell: bash
        env:
          INPUT_REPOSITORY: ${{ inputs.active_repository }}
          INPUT_ARCHIVE_REF: ${{ inputs.archive_ref }}
          INPUT_CURRENT_VOLUME: ${{ inputs.current_volume }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_REPOSITORY}" || -n "${INPUT_ARCHIVE_REF}" || -n "${INPUT_CURRENT_VOLUME}" ]]; then
            test -n "${INPUT_REPOSITORY}" && test -n "${INPUT_ARCHIVE_REF}" && test -n "${INPUT_CURRENT_VOLUME}"
            active_repository="${INPUT_REPOSITORY}"
            archive_ref="${INPUT_ARCHIVE_REF}"
            current_volume="${INPUT_CURRENT_VOLUME}"
          else
            active_repository="$(jq -er '.repository' "${GITHUB_WORKSPACE}/data/hub-source.json")"
            current_volume="$(jq -er '.current_volume | tostring' "${GITHUB_WORKSPACE}/data/hub-source.json")"
            archive_ref="$(git ls-remote "https://github.com/H234598/${active_repository}.git" refs/heads/main | awk 'NF { print $1; exit }')"
            test -n "${archive_ref}"
          fi
          python3 -m wirtelprimpf_platform.hub \
            --data-root "${GITHUB_WORKSPACE}/data" \
            --external-root "${GITHUB_WORKSPACE}/current-archive" \
            --github-output "${GITHUB_OUTPUT}" \
            --repository "${active_repository}" \
            --revision "${archive_ref}" \
            --current-volume "${current_volume}"

      - name: Checkout exact active publication archive
        if: steps.source.outputs.external == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ format('H234598/{0}', steps.source.outputs.repository) }}
          ref: ${{ steps.source.outputs.revision }}
          path: current-archive
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install exact dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build and validate hub artifact through staging facade
        env:
          PUBLIC_CATGPT_LIGHT_ENDPOINT: https://catgpt.wirtelprimpf.telacore.org/v1/chat
          WIRTELPRIMPF_DATA_ROOT: ${{ github.workspace }}/data
          WIRTELPRIMPF_SITE_PROFILE: hub
          WIRTELPRIMPF_SITE_URL: https://wirtelprimpf.telacore.org
          WIRTELPRIMPF_CURRENT_STORY: ${{ steps.source.outputs.story_file }}
          WIRTELPRIMPF_CURRENT_VOLUME: ${{ steps.source.outputs.current_volume }}
          WIRTELPRIMPF_MEDIA_MANIFEST: ${{ steps.source.outputs.media_manifest }}
          WIRTELPRIMPF_MEDIA_REPOSITORY: ${{ steps.source.outputs.repository }}
          WIRTELPRIMPF_README_PATH: ${{ github.workspace }}/README.md
          WIRTELPRIMPF_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/build_web_site.py \
            --profile hub \
            --site-url https://wirtelprimpf.telacore.org \
            --expected-domain wirtelprimpf.telacore.org \
            --data-root "${GITHUB_WORKSPACE}/data" \
            --config config/web-budgets.json \
            --check > "$RUNNER_TEMP/pages-build-report.raw.json"
          jq \
            --arg generator_revision "${{ steps.revisions.outputs.generator_ref }}" \
            --arg archive_revision "${{ steps.source.outputs.revision }}" \
            --arg current_volume "${{ steps.source.outputs.current_volume }}" \
            '. + {generator_revision: $generator_revision, archive_revision: $archive_revision, current_volume: $current_volume}' \
            "$RUNNER_TEMP/pages-build-report.raw.json" > "$RUNNER_TEMP/pages-build-report.json"
          cat "$RUNNER_TEMP/pages-build-report.json"
          grep -R -n "connect-src https://catgpt\.wirtelprimpf\.telacore\.org" web/dist
          grep -E -q '"tree_sha256": "[0-9a-f]{64}"' "$RUNNER_TEMP/pages-build-report.json"

      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact build artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
