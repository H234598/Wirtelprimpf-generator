name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wirtelprimpf-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  applet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout relevant repository paths
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            Makefile
            Sourcecode
            files
            scripts
            tests
            docs
          sparse-checkout-cone-mode: true
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r Sourcecode/requirements.txt

      - name: Run repository checks
        run: make check
