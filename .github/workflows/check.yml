name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wirtelprimpf-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  applet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout relevant repository paths
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            Makefile
            Sourcecode
            files
            scripts
            tests
            docs
            config
            README.md
            PROVENANCE.md
            wirtelprimpf_platform
            pyproject.toml
          sparse-checkout-cone-mode: true
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r Sourcecode/requirements.txt

      - name: Run repository checks
        run: make check

  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout generator sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            Makefile
            Sourcecode
            files
            scripts
            tests
            wirtelprimpf_platform
            web/fixtures/site
            pyproject.toml
            LICENSE
            README.md
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install generator package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Verify transactional settings entrypoint
        run: wirtelprimpf-settings --help >/dev/null

      - name: Run platform contract tests
        run: python -m unittest discover -s tests/platform -p 'test_*.py' -v

      - name: Compile all Python sources
        run: python -m compileall -q Sourcecode wirtelprimpf_platform scripts

      - name: Verify CLI entrypoint
        run: wirtelprimpf-platform mapping 51

  catgpt-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout CatGPT worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: catgpt-worker
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: catgpt-worker/package-lock.json

      - name: Install exact worker dependencies
        run: npm --prefix catgpt-worker ci --ignore-scripts

      - name: Test worker
        run: npm --prefix catgpt-worker test

      - name: Type-check worker
        run: npm --prefix catgpt-worker run check

      - name: Verify worker deployment bundle
        run: npm --prefix catgpt-worker run deploy -- --dry-run

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout site factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            config/web-budgets.json
            web
            scripts/build_web_status.py
            scripts/validate_pages_artifact.py
            scripts/validate_web_budgets.py
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Test and type-check the site factory
        working-directory: web
        env:
          WIRTELPRIMPF_DATA_ROOT: ${{ github.workspace }}/web/fixtures/site
          WIRTELPRIMPF_SITE_PROFILE: hub
        run: |
          npm test
          npm run check

      - name: Install Chromium for browser gates
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser, accessibility, and performance gates
        working-directory: web
        env:
          PUBLIC_CATGPT_LIGHT_ENDPOINT: https://catgpt.wirtelprimpf.telacore.org/v1/chat
          WIRTELPRIMPF_DATA_ROOT: ${{ github.workspace }}/web/fixtures/site
          WIRTELPRIMPF_SITE_PROFILE: hub
          WIRTELPRIMPF_SITE_URL: https://wirtelprimpf.telacore.org
        run: |
          npm run test:browser
          npm run test:performance

      - name: Build and validate hub profile
        env:
          PUBLIC_CATGPT_LIGHT_ENDPOINT: https://catgpt.wirtelprimpf.telacore.org/v1/chat
          WIRTELPRIMPF_DATA_ROOT: ${{ github.workspace }}/web/fixtures/site
          WIRTELPRIMPF_SITE_PROFILE: hub
          WIRTELPRIMPF_SITE_URL: https://wirtelprimpf.telacore.org
        run: |
          npm --prefix web run build
          rg -n "connect-src https://catgpt\.wirtelprimpf\.telacore\.org" web/dist
          python3 scripts/validate_pages_artifact.py web/dist --expected-domain wirtelprimpf.telacore.org
          python3 scripts/validate_web_budgets.py --root web/dist --config config/web-budgets.json --strict

      - name: Build and validate archive profile
        env:
          PUBLIC_CATGPT_LIGHT_ENDPOINT: https://catgpt.wirtelprimpf.telacore.org/v1/chat
          WIRTELPRIMPF_DATA_ROOT: ${{ github.workspace }}/web/fixtures/site
          WIRTELPRIMPF_SITE_PROFILE: archive
          WIRTELPRIMPF_SITE_URL: https://wirtelprimpf-0001.telacore.org
        run: |
          npm --prefix web run build
          rg -n "connect-src https://catgpt\.wirtelprimpf\.telacore\.org" web/dist
          python3 scripts/validate_pages_artifact.py web/dist --expected-domain wirtelprimpf-0001.telacore.org
          python3 scripts/validate_web_budgets.py --root web/dist --config config/web-budgets.json --strict

      - name: Verify source checkout remains unchanged
        run: |
          git diff --exit-code -- .
          unexpected="$(git ls-files --others --exclude-standard | grep -v '^web/src/generated/status\.json$' || true)"
          test -z "$unexpected"

      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-diagnostics-${{ github.run_id }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
